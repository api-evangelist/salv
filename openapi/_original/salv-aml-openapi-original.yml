  /v2/persons/{personId}:
    patch:
      tags:
        - aml
      summary: Patch person
      description: |
        Partial person update. Only attributes present in request will be added/updated. Attributes supported maximum
        nesting depth is 2.

        This endpoint also supports optional person type update.

        In case the operation is successful there will be an empty response.

        ### Examples
        #### cURL
        ```
        $ curl --request PATCH \
          --url https://app.salv.com/api/v2/persons/{personId} \
          --header 'Authorization: Bearer {yourBearerToken}' \
          --header 'Content-Type: application/json' \
          --data '{
            "type": "LEGAL",
            "attributes": {
              "company_name": "Best Vacuum Cleaning Ltd."
            }
          }'
        ```

        #### With Python Requests
        ```
        import requests

        payload = {
          "attributes": {
            "phone_number": "(198)747-8241x9209",
            "shareholders": [{
              "id": 1,
              "name": "Rose Doe",
              "dob": "1970-01-01",
              "email": "rose.doe@gmail.com"
            }]
          }
        }

        response = requests.post(
           'https://app.salv.com/api/v2/persons/{personId}',
           auth = ({clientId}, {clientSecret}),
           json = payload)

        response.raise_for_status()
        ```
      operationId: patchPersonV2
      parameters:
        - name: personId
          in: path
          description: External unique person ID
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: 'models.yaml#/components/schemas/ApiPatchPersonV2'
            examples:
              Individual:
                value:
                  attributes: { "last_name": "Doe", "dob": "1970-01-01" }
              Legal:
                value:
                  attributes: { "phone_number": "(198)747-8241x9209",
                                "shareholders": [ { "id": 1, "name": "Rose Doe", "dob": "1970-01-01", "email": "rose.doe@gmail.com" } ]
                  }
              TypeChange:
                value:
                  type: "LEGAL"
                  attributes: { "companyName": "Very Good Vacuum Cleaning Ltd." }
      responses:
        '200':
          description: Successfully updated person
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Person not found
    put:
      tags:
        - aml
      summary: Update person
      description: |
        Person update. Attributes in the request will be used to replace existing ones and type will be updated. 
        Attributes supported maximum nesting depth is 2.
        
        In case the operation is successful there will be an empty response.

        ### Examples
        #### cURL
        ```
        $ curl --request PUT \
          --url https://app.salv.com/api/v2/persons/{personId} \
          --header 'Authorization: Bearer {yourBearerToken}' \
          --header 'Content-Type: application/json' \
          --data '{
            "type": "LEGAL",
            "attributes": {
              "company_name": "Best Vacuum Cleaning Ltd."
            }
          }'
        ```

        #### With Python Requests
        ```
        import requests

        payload = {
          "type": "INDIVIDUAL",
          "attributes": {
            "phone_number": "(198)747-8241x9209",
            "shareholders": [{
              "id": 1,
              "name": "Rose Doe",
              "dob": "1970-01-01",
              "email": "rose.doe@gmail.com"
            }]
          }
        }

        response = requests.post(
           'https://app.salv.com/api/v2/persons/{personId}',
           auth = ({clientId}, {clientSecret}),
           json = payload)

        response.raise_for_status()
        ```
