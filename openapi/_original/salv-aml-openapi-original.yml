  - name: risk
    description: |
      Risks levels are assigned to persons according to configured risk rules. It is up to client how
      to interpret each particular level.
      
      Risk rules are configured in Salv UI.
      
      Person risk is scored every time one of the following triggering events occurs:
      - the person is created
      - the person is updated
      - a transaction is added to the person
      - a monitoring alert is created for the person
      - the status of a monitoring alert of the person is updated
      - the status of a screening alert of the person is changed to any true positive status
      - the status of a screening alert of the person is changed from any of true positive statuses to non true positive status
      
      Person risk scoring happens in the background and the service does not guarantee any time frame for it.
      
      Risk levels can be overridden by client operators for any particular person. They would need to choose one 
      of the preconfigured override reasons, which are also configured in Salv UI.
    x-displayName: Risks
  - name: alert
    x-displayName: Monitoring alerts
  - name: unresolved-alerts
    description: Endpoints to check if given entity has anything unresolved
    x-displayName: Unresolved alerts
  - name: custom-list-record
    description: |
      Endpoints to add, update, delete and get custom list records.
      
      Custom Lists can be used in two ways:
      - Custom Lists can be used to screen persons and transactions against them in the same way it works for Dow Jones
      lists. For example, if a client has some in-house black list, it can be added to screening as custom list.
      - Custom Lists can be referenced in monitoring scenarios. For example, a scenario may trigger when the transaction
      amount is higher than some threshold and the recipient country is in custom list of high risk countries.
    x-displayName: Custom Lists
  - name: custom-list-usable-field-public
    description: Custom list usable fields can be used in [Screening search](#tag/screening-searches/operation/search)
    x-displayName: Custom List usable fields
  - name: webhooks
    x-displayName: Webhooks
    x-traitTag: true
    description: |
      
      ### Setting up
      
      You can set up webhook configuration on the [webhooks](https://app.salv.com/webhooks) page.  
      
      Please note that you must have an **administrator** role.
      
      ### Webhook retry mechanism
      
      If sending the webhook fails, we'll retry sending it until it is accepted. Retry attempts happen regularly for up to 7 days, at increasing time intervals:
      - 2 minutes
      - 5 minutes
      - 10 minutes
      - 15 minutes
      - 30 minutes
      - 1 hour
      - 2 hours
      - 4 hours

      After that, retries happen every 8 hours for the following 7 days. For tackling transient errors (like a momentary network glitch) we retry every request 3 times with 1 second interval.
      
      The timeout limit for webhooks is 1 second for connect and 9 seconds for read timeout.
      
      ### Webhook triggers
      
      Salv supports sending out certain webhooks based on the following event triggers:
      - __Trigger__ -> __Supported Actions__
      - `ALERT` -> `ALERT_CREATED`
      - `ALERT_STATUS`  -> `ALERT_STATUS_UPDATED`
      - `SCREENING_ALERT` -> `SCREENING_ALERT_CREATED`
      - `SCREENING_ALERT_STATUS` -> `SCREENING_ALERT_STATUS_UPDATED`
      - `SCREENING_ALERT_UPDATE` -> `SCREENING_ALERT_UPDATED`
      - `FINAL_RISK` -> `FINAL_RISK_UPDATED`
      - `PERSON_STATUS` -> `PERSON_STATUS_UPDATED`
      - `PERSON` -> The name of the succeeding decision rule. Example: `PERSON_CLEARED`
      - `TRANSACTION` -> The name of the succeeding decision rule. Example: `TRANSACTION_CLEARED`
      - `CUSTOM_LIST_RECORD` -> `CUSTOM_LIST_RECORD_CREATED`, `CUSTOM_LIST_RECORD_UPDATED`, `CUSTOM_LIST_RECORD_ARCHIVED`
      - `MANUAL_ALERT` -> `MANUAL_ALERT_CREATED`
      - `MANUAL_ALERT_STATUS` -> `MANUAL_ALERT_STATUS_UPDATED`

      ### Decision webhook
      
      When configuring decision webhook rules, every time an alert related to a person or a transaction is changed, this set of rules will be run on all the related alerts for that person/transaction.  
      If any of the rules succeeds, it will send out a webhook with the name of that rule in action parameter. For more information, check Salv user manual.

      <SchemaDefinition schemaRef="#/components/schemas/WebhookEvent" />
  - name: data-upload
    x-displayName: Data upload from CSV
    description: |
      ## Steps to upload data using CSV
      1. Format the  csv file and add all the mandatory data fields indicated in the  [User Manual](https://help.salv.com/en/articles/154650-data-overview)

      2. Upload the [csv file via API](#tag/data-upload/operation/uploadData).  Note: the upload API response contains the id that will to be used in status check API call (step 3). 
      When a data file has been successfully uploaded, an HTTP response with 202 status code is returned. A response with 202 status code indicates that the file has been uploaded successfully and the system will try to process the data. It does not guarantee that data will be successfully processed.

            What will happen next?
            1.  First comes the **validation phase**: 
                1. If the Schemas are added in the UI, then our system will validate the file against the schemas (e.g. if there is a field added with DATE type, then system will validate if the date format is correct)
                2. If no Schemas are added in the UI, then our system will consider all fields as STRING
      
                Note: during this validation phase we do not check if the transaction has been added to the system before. 
      
                3. If there are any errors, then no data will be uploaded. In this case calling [check status API call](#tag/data-upload/operation/getDataUploadStatus) will return FAILED status and a error message for the the first error encountered. The error message will be in the `reason` field in a human readable text. 
                4. If there are no errors, then the upload phase starts.
      
            2. Second (if no errors occurred) comes the **upload phase**: our system will start uploading and saving data in batches of 1000, and in case of transaction file will check for duplicates and if the person is present in the system.  
                1. If no errors occur, then the file is uploaded successfully.
                2. If an error occurs, then when step no 3 ([check status API call](#tag/data-upload/operation/getDataUploadStatus)) is done, then: 
                    1. system will show the first error and give the id of the person or transaction that caused the error. 
                    2. system will show the id of the last uploaded person or transaction and the id of the first person or transaction that was not uploaded.
      
                    and, 
      
                    3. the data following the last uploaded person or transaction will not be uploaded. 
            - Example:
      
              > Csv file has 200 000 rows. There is a duplicate id on row 87 456.  In **validation phase** duplicate errors are not checked thus the file will move on to the **upload phase**. First 87 000 rows are uploaded without any errors. Rows starting from 87 001 will not get uploaded because there is a duplicate error in the batch (the patch of 1000 that gets checked). System will show that there is a duplicate, will show the id of the duplicate Person or Transaction and will show the last uploaded Person or Transaction id and the last id that was not added. 
      
              Example of an **upload phase** error message:
      
              ```jsx
              {
                  "status": "PARTIALLY_COMPLETED",
                  "reason": "The upload appears to contain transactions (id ameio-1234567) that have already been added to Salv. Please make sure that your upload does not contain any duplicates or transactions that have already been added to Salv. The first transaction not added to Salv with this upload has id fmeio-1234567. Last processed and saved row was with id: dseio-1234567"
              }
              ```

      3. In order to check the status of the file upload either use [get status of data upload API call](#tag/data-upload/operation/getDataUploadStatus) or check Data upload page on app.salv.com. This will provide the status and any further information about the errors.
  - name: monitoring-overview
    x-displayName: Monitoring overview
    x-traitTag: true
    description: |
      Monitoring allows clients to run various checks (called scenarios) against their persons and transactions.
      There are three scenario types:
      - **Real-time** (ONLINE) scenarios are run by client by calling real-time checks endpoints. Those are intended to be used for the 
      real time checks, for example to decide whether or not to suspend a transaction.
      - **Post-event** (OFFLINE) scenarios are run by Salv. Person post-event scenarios are run when person is created or updated, 
      transaction post-event scenarios are only run on transaction creation.
      - **Periodic** scenarios are run by Salv according to specified schedule.
      
      All those scenarios are configured in Salv UI. For each pair of triggered scenario and person/transaction one 
      monitoring alert is created. Those alerts are stored by Salv and can later be accessed in UI or by API.
      
      ## Example: Real-time (pre-processing) transaction monitoring
      Transaction monitoring runs all real-time (ONLINE) monitoring scenarios and returns response in realtime. This flow can be used to block a transaction based on transaction monitoring checks.

      ### 1. Add a person (if not already added) and a transaction
      Add a person and a transaction as shown in [Example: Uploading person and transaction](#tag/aml/Example:-Uploading-person-and-transaction).

      ### 2. Perform monitoring check
      Perform transaction monitoring according to the documentation at [runTransactionMonitoringChecks(POST)](#operation/runTransactionMonitoringChecks).

      #### With cURL
      ```
      curl --request POST \
        --url https://app.salv.com/api/v1/transactions/transactionId/monitoring-checks \
        --header 'Authorization: Bearer {yourBearerToken}' \
        --header 'Content-Type: application/json'
      ```
      #### With Python Requests
      ```
      import requests

      url = "https://app.salv.com/api/v1/transactions/transactionId/monitoring-checks"

      headers = {
          "Content-Type": "application/json",
          "Authorization": "{yourBearerToken}"
      }

      response = requests.request("POST", url, headers=headers)

      print(response.text)
      ```
      #### API response when an alert was created
      In this case you should block the transaction using your internal logic.
      ```
      {
        "results": [
          {
            "reason": "High incoming sum",
            "details": "Sum >= 5 000€ (Sum: 19 694.05) in last 30 days",
            "score": 100,
            "weight": 1,
            "scenarioType": "ONLINE",
            "alertId": 321
          },
          {
            "reason": "Outgoing transfer is 80% of the total balance",
            "details": "Amount: 7785.0, balance: 9693.43",
            "score": 100,
            "weight": 1,
            "scenarioType": "ONLINE",
            "alertId": 543
          }
        ]
      }
      ```
      #### API response when no alert was created
      In this case you should process the transaction as no alert was created.
      ```
      {
        "results": []
      }
      ```
      
      ## Decision lifecycle

      <img src="https://docs.salv.com/api/flow.jpg" alt="Data flow diagram">
  - name: screening-overview
    x-displayName: Screening overview
    x-traitTag: true
    description: |
      **Screening** allows clients to check their persons and transactions against screening lists, such as sanctions lists,
      PEPs (politically exposed persons) lists and adverse media lists. It is also possible to configure **custom lists** to
      check persons and transactions against them as well.
      
      There are two ways to use screening. 
      
      - To quickly check some name against the screening lists without uploading any data or creating alerts use 
      [screening search endpoint](#tag/screening-searches/operation/search).
      
      - To configure more intricate checks first upload person and transaction data to Salv. That will enable automatic 
      person re-screening and allow you to configure a lot of screening details. Then it will be possible to run screening 
      with all that configuration for any particular person or transaction using [the API](#tag/screening-checks).

      #### Screening settings that can be configured in Salv IU
      - Clearance rules
      - Fields to screen
      - Significant Update Indicators
      - Transaction Goodlist Identifiers
      - Person and Transaction Segments
      - Automatic Re-screening
      - Dow Jones lists to screen against
      - Custom Lists to screen against
      - Fuzzy matching threshold
      - BIC Length Threshold
      
      ## Example: Transaction screening
      Transaction screening checks transaction sender and recipient names against screening lists

      ### 1. Add a transaction
      Add a new transaction, according to the documentation at [addTransaction(POST)](#operation/addTransaction).

      ### 2. Perform screening check
      Perform transaction screening according to the documentation at [checkTransaction(POST)](#operation/checkTransaction).

      #### With cURL
      ```
      curl -X POST \
        https://app.salv.com/api/v1/transactions/000000000000009/screening-checks \
        -H 'Authorization: Bearer {yourBearerToken}' \
        -H 'Content-Type: application/json'
      ```
      #### With Python Requests
      ```
      import requests

      url = "https://app.salv.com/api/v1/transactions/id/screening-checks"

      headers = {
          "Content-Type": "application/json",
          "Authorization": "{yourBearerToken}"
      }

      response = requests.request("POST", url, headers=headers)

      print(response.text)
      ```
      #### API response when an alert was created
      In this case you should block the transaction using your internal logic.
      ```
      {
        "matches": [
          {
            "flowId": "b09ab27c-2581-4833-9c90-62a51f078f60",
            "inputData": "Hassan Bahadlri",
            "matchData": "{"id": "67c79e6f14245df0791a307154512e8a097d6a57", "schema": "Person", "properties": {"name": ["Hassan Bahadori"], "lastName": ["Bahadori"], "firstName": ["Hassan"]}}",
            "sanctionList": "US OFAC sanctions",
            "score": 99,
            "checkType": "SANCTION",
            "alertId": 321
            "referenceGroupCodes": ["EUCON", "OFACAIS"]
          },
          {
            "flowId": "96aafb73-17ec-43c4-a9d8-83bf0785f9cf",
            "inputData": "Gazprom Neft",
            "matchData": "{"id": "303a2ec82f2c5c48e051bfd7e3822baba5b9ca06", "schema": "LegalEntity", "properties": {"name": ["Gazprom Neft"]}}",
            "sanctionList": "CH SECO sanctions",
            "score": 100,
            "checkType": "SANCTION"
            "alertId": 123,
            "referenceGroupCodes": null
          }
        ]
      }
      ```
      #### API response when no alert was created
      In this case you should process the transaction as no alert was created.
      ```
      {
        "matches": []
      }
      ```
      ## Example: Person screening
      Person screening checks person name against screening lists

      ### 1. Add a person if not already added
      Add a new person, according to the documentation at [addPerson(POST)](#operation/addPersonV2).

      If the person has already been added to Salv, then skip this step.

      ### 2. Perform screening check
      Perform person screening according to the documentation at [checkPerson(POST)](#operation/checkPerson).

      #### With cURL
      ```
      curl -X POST \
        https://app.salv.com/api/v1/persons/000007/screening-checks \
        -H 'Authorization: Bearer {yourBearerToken}' \
        -H 'Content-Type: application/json'
      ```
      #### With Python Requests
      ```
      import requests

      url = "https://app.salv.com/api/v1/persons/id/screening-checks"

      headers = {
          "Content-Type": "application/json",
          "Authorization": "{yourBearerToken}"
      }

      response = requests.request("POST", url, headers=headers)

      print(response.text)
      ```
      #### API response when an alert was created
      ```
      {
        "matches": [
          {
            "flowId": "b09ab27c-2581-4833-9c90-62a51f078f60",
            "inputData": "Hassan Bahadlri",
            "matchData": "{"id": "67c79e6f14245df0791a307154512e8a097d6a57", "schema": "Person", "properties": {"name": ["Hassan Bahadori"], "lastName": ["Bahadori"], "firstName": ["Hassan"]}}",
