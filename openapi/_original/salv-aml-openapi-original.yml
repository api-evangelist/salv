components:
  schemas:
    WebhookEvent:
      title: a Webhook Event
      description: a Webhook event
      x-extendedDiscriminator: action
      discriminator:
        propertyName: action
        mapping:
          ALERT_CREATED: '#/components/schemas/AlertCreatedEvent'
          ALERT_STATUS_UPDATED: '#/components/schemas/AlertStatusUpdatedEvent'
          SCREENING_ALERT_CREATED: '#/components/schemas/ScreeningAlertCreatedEvent'
          SCREENING_ALERT_STATUS_UPDATED: '#/components/schemas/ScreeningAlertStatusUpdatedEvent'
          SCREENING_ALERT_UPDATED: '#/components/schemas/ScreeningAlertCreatedEvent'
          FINAL_RISK_UPDATED: '#/components/schemas/FinalRiskUpdatedEvent'
          PERSON_STATUS_UPDATED: '#/components/schemas/PersonStatusUpdatedEvent'
          PERSON_CLEARED: '#/components/schemas/PersonClearedEvent'
          TRANSACTION_CLEARED: '#/components/schemas/TransactionClearedEvent'
          CUSTOM_LIST_RECORD_CREATED: '#/components/schemas/CustomListRecordCreatedEvent'
          CUSTOM_LIST_RECORD_UPDATED: '#/components/schemas/CustomListRecordUpdatedEvent'
          CUSTOM_LIST_RECORD_ARCHIVED: '#/components/schemas/CustomListRecordArchivedEvent'
          MANUAL_ALERT_STATUS_UPDATED: '#/components/schemas/ManualAlertStatusUpdatedEvent'
          MANUAL_ALERT_CREATED: '#/components/schemas/ManualAlertCreatedEvent'
      properties:
        action:
          type: string
        createdTime:
          type: string
          format: date-time
          description: Event created time
    AlertCreatedEvent:
      required:
        - metadata
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - properties:
            metadata:
              $ref: '#/components/schemas/AlertCreatedEventMeta'
    AlertCreatedEventMeta:
      required:
        - alertId
        - personId
        - transactionId
        - entityType
        - scenarioType
        - hits
      allOf:
        - properties:
            alertId:
              type: integer
              format: int64
              example: 1001
              description: Alert unique ID
              minimum: 1
            personId:
              type: string
              example: user-0000007
              description: Alerted person's external ID
              minLength: 1
            transactionId:
              type: string
              example: transaction-0000005
              description: Alerted transaction's external ID
            entityType:
              type: string
              enum:
                - PERSON
                - TRANSACTION
              example: TRANSACTION
              description: Entity type
            scenarioType:
              type: string
              enum:
                - ONLINE
                - OFFLINE
                - PERIODIC
              example: OFFLINE
              description: Type of scenario that created the alert
            hits:
              type: array
              items:
                $ref: '#/components/schemas/AlertCreatedEventHit'
    AlertCreatedEventHit:
      required:
        - reason
        - details
      allOf:
        - properties:
            reason:
              type: string
              example: 'High incoming sum'
              description: Triggered scenario reason
              minLength: 1
            details:
              type: string
              example: 'Sum >= 5 000€ (Sum: 19 694.05) in last 30 days'
              description: Triggered scenario details
              minLength: 1
            scenarioHandle:
              type: string
              example: '1fea3186-ff7a-4602-866c-1f39e5f63fbf'
              description: Triggered scenario handle
              minLength: 1
    AlertStatusUpdatedEvent:
      required:
        - metadata
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - properties:
            metadata:
              $ref: '#/components/schemas/AlertStatusUpdatedEventMeta'
    AlertStatusUpdatedEventMeta:
      required:
        - alertId
        - oldStatus
        - newStatus
        - personId
        - transactionId
        - entityType
        - scenarioType
        - note
        - updatedBy
      allOf:
        - properties:
            alertId:
              type: integer
              format: int64
              example: 1001
              description: Updated alert's ID
              minimum: 1
            oldStatus:
              type: string
              example: NEW
              description: Alert's previous status
              minLength: 1
            newStatus:
              type: string
              example: CLOSED
              description: Alert's new status
              minLength: 1
            personId:
              type: string
              example: user-0000007
              description: Alerted person's external ID
              minLength: 1
            transactionId:
              type: string
              example: transaction-0000005
              description: Alerted transaction's external ID
            entityType:
              type: string
              enum:
                - PERSON
                - TRANSACTION
              example: TRANSACTION
              description: Entity type
            scenarioType:
              type: string
              enum:
                - ONLINE
                - OFFLINE
                - PERIODIC
              example: OFFLINE
              description: Type of scenario
            note:
              type: string
              example: Name mismatch
              description: Alert status update note
            updatedBy:
              type: string
              example: Name
              description: User updating alert
              minLength: 1
    PersonStatusUpdatedEvent:
      required:
        - metadata
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - properties:
            metadata:
              $ref: '#/components/schemas/PersonStatusUpdatedEventMeta'
    PersonStatusUpdatedEventMeta:
      required:
        - personId
        - oldStatus
        - newStatus
        - updatedBy
      allOf:
        - properties:
            personId:
              type: string
              example: user-0000007
              description: Updated person's external ID
              minLength: 1
            oldStatus:
              type: string
              example: NEW
              description: Person's previous status
              minLength: 1
            newStatus:
              type: string
              example: MONITORING
