  - name: screening-alerts
    description: Screening alert is created when a particular field of a particular person matches against one of the screening lists. Screening alert has a list of hits, each of which represent one matched record from screening list. Some of the hits can be cleared automatically according to the configured clearance rules and goodlists.
    x-displayName: Screening alerts
  - name: alerts
    description: |
      Salv has multiple properties that are associated with individual alerts and influence alert management process based on their assignment. Using the initial alert ID and TYPE that are generated after different checks are triggered and communicated via API or WEBHOOKS, it is possible to programmatically modify these properties to streamline your business logic.
      
      **Attention:** To start using this API, the client id used for authentication needs to be created **after 16.05.2023**. If your integration currently uses credentials created before this date, you must create a NEW credentials pair, and replace the existing one.
    x-displayName: Alerts
  - name: manual-alerts
    description: |
      Manual alerts allow compliance officers to create alerts manually for persons or transactions that require investigation
      outside of automated monitoring and screening processes. These alerts can be used to flag suspicious activity identified
      through external sources, customer complaints, or other manual review processes.

      Manual alerts support the same status workflow as other alert types and can be integrated into existing case management processes.
    x-displayName: Manual Alerts
