openapi: 3.0.3
info:
  title: Salv AML API
  description: |
    # Introduction
    Welcome to the Salv AML API documentation.

    The Salv API is built on HTTP. Our API is RESTful. It has predictable resource URLs. It returns HTTP response codes to indicate errors. It also accepts and returns JSON in the HTTP body. You can use your favorite HTTP/REST library for your programming language to use Salv API.

    API definition to import into Postman can be downloaded at https://docs.salv.com/api/public.yaml

  version: 1.0.9
  contact:
    name: Support
    email: support@salv.com

  x-logo:
    url: "salv.svg"
    altText: "Salv API"

servers:
  - url: https://{environment}.salv.com/api/
    variables:
      environment:
        default: app
        enum:
          - app
          - demo
        description: |
          Select environment:
          * `app` - Production
          * `demo` - Sandbox

tags:
  - name: getting-started
    x-displayName: Getting started
    x-traitTag: true
    description: |
      ## Signing up
      Contact our sales team at sales@salv.com to sign up for service.
      
      ## Terms used
      * **Client** — organisation that is using or intends to use Salv service.
      * **Client application** — application owned by client. Will probably integrate with this API.
      * **Person** — natural person or legal entity, one of the customers of the client.
      * **Transaction** — monetary transaction performed by one of the persons.
      
      ## General workflow
      While the integration process may wary in each case, on average the steps to use the service look as follows:
      * Upload historical persons and transactions data using 
      [CSV data upload endpoint](#tag/data-upload/operation/uploadData).
      * Configure client application to upload new persons and transactions automatically using 
      [addPerson endpoint](#operation/addPersonV2) and [addTransaction endpoint](#operation/addTransaction).
      * Configure monitoring, screening and risks. That would include monitoring scenarios, risk rules and a number of 
      settings for screening. Currently, most of those things can only be configured through Salv UI. However, some of 
      the configuration is available in open API as well:
        * [Custom Lists](#tag/custom-list-record)
      * Salv will produce monitoring alerts, screening alerts and risk levels for provided persons and 
      transactions based on configuration provided:
        * [Monitoring alerts](#tag/monitoring-overview) are created according to configured scenarios
        * [Screening alerts](#tag/screening-overview) are created during Automatic Re-screening and on API calls
        * [Risks](#tag/risk) are calculated on data updates
      * In order to receive the data about new screening and monitoring alerts in real time, client would need to 
      configure [webhooks](#tag/webhooks). Configuring a webhook will cause Salv to notify client application about a 
      particular event, for example about a creation of a new alert or change of a risk level for any person.
      
      Alternatively, all the monitoring alerts, screening alerts and risk levels are available in Salv UI, along with 
      a lot of features to help manage and organize the process of examining the alerts and risks.

      ## Authentication
      
      <!-- ReDoc-Inject: <security-definitions> -->

      ### Authentication flow examples
      #### With cURL
      ```
      $ curl -X POST -u "{clientId}:{clientSecret}" -d "grant_type=client_credentials" "https://app.salv.com/oauth/token"
      {
        "access_token": "{yourBearerToken}",
        "expires_in": 1576799999,
        "token_type": "Bearer"
      }
      ```
      #### With Python Requests
      ```
      import requests

      resp = requests.post('https://app.salv.com/oauth/token', auth=({clientId}, {clientSecret}), data={'grant_type': 'client_credentials'})
      print(resp.json())

      {
        "access_token": "{yourBearerToken}",
        "expires_in": 1576799999,
        "token_type": "Bearer"
      }
      ```

      ## Compatibility
      - New properties may be added to a representation at any time. Make sure that your API client will ignore any unknown properties.
      - Removal or alteration of an existing property will be handled through versioning.

      ## Error handling
      ### Errors 4XX
      Client errors (400-499) indicate issues with the request that should be fixed before retrying.

      | Status Code | Meaning | Action |
      |-------------|---------|--------|
      | 400 Bad Request | Invalid request format or parameters | Check request body and parameters |
      | 401 Unauthorized | Missing or invalid authentication | Refresh access token and retry |
      | 403 Forbidden | Insufficient permissions | Check API client permissions |
      | 404 Not Found | Resource does not exist | Verify resource ID exists |
      | 409 Conflict | Resource state conflict | Check current state before retrying |
      | 422 Unprocessable Entity | Entity already exists | Use existing entity or different identifier |

      **Do not retry** 4XX errors without fixing the underlying issue first (except 401 after token refresh).

      ### Errors 5XX

      All requests which return a response with status code 500-599 should be retried after some interval.

      If a retry of a failed request fails again, it should be retried again until it succeeds. Retrying a request that repeatedly fails should be done at increasingly longer interval.

      ### Rate Limiting (429 errors)

      API requests are subject to rate limiting to ensure fair usage and system stability. When you exceed the rate limit,
      the API returns HTTP status code **429 Too Many Requests**.

      #### Handling rate limits

      When you receive a 429 response:
      1. Wait before retrying - implement exponential backoff
      2. Queue requests and process them at a sustainable rate
      3. Contact support if you need higher limits
  - name: aml
    x-displayName: Persons & Transactions
    description: |
      This section contains all operations managing the state of persons and transactions.
      
      There are three endpoints for creating or modifying a person, make sure to choose the right one for your task:
      * [Create new person](#tag/aml/operation/addPersonV2) will create a new person if a person with the same ID does not already exist in our system. 
      * [Patch person](#tag/aml/operation/patchPersonV2) partially updates an existing person if this person exists in the system. A request to this endpoint will only update or add 
      attributes which are provided in the request. Use this endpoint to update selected 
      attributes of a person or to add new attributes without changing attributes not present in the request payload. This endpoint may also be used to update person type.
      * [Update person](#tag/aml/operation/updatePersonV2) updates an existing person if this person exists in the system. A request to this endpoint must contain both person type and attributes. 
      A request to this endpoint overwrites both person type and attributes with the values given in the request.
      
      ID of a person or a transaction is a case-sensitive text field in our system. Salv does not transform the ID in any way. Only the following characters are allowed: Alphanumerics `a-zA-Z0-9`, hyphens `-`, underscores `_`, colons `:`, dots `.`.
      
      All requests must use ISO-8601 formatted timestamps. That includes defined fields (e.g. timestamp property in "Create new transaction" request) and custom key-value pairs (e.g. under attributes property in "Create new person" request).
      
      For any data passed in person or transaction objects, the keys must adhere to the following rules:  
      - It must not contain a "**.**"
      - It must not consist of whitespaces

      ## Example: Uploading person and transaction
      This example shows how to upload data to use it later for monitoring or screening.

      ### 1. Add a person if not already added
      Add a new person, according to the documentation at [addPerson(POST)](#operation/addPersonV2).

      If the person has already been added to Salv, then skip this step.

      #### With cURL
      ```
      curl --request POST \
        --url https://app.salv.com/api/v2/persons \
        --header 'Authorization: Bearer {yourBearerToken}' \
        --header 'Content-Type: application/json' \
        --data '{
        "id": "bbt12345",
        "type": "INDIVIDUAL",
        "attributes": {
          "first_name": "Sheldon",
          "last_name": "Cooper",
          "dob": "1983-05-12",
          "city": "Pasadena",
          "street_address": "2311 North Los Robles Avenue",
          "country": "US",
          "onboarding_date": "2019-04-16",
          "email": "sheldon.cooper@gmail.com",
          "phone_number": "+1582693582",
          "id_document": "passport",
          "id_country": "US",
          "gender": "F"
        }
      }'
      ```

      #### With Python Requests
      ```
      import requests

      url = "https://app.salv.com/api/v2/persons"

      payload = {
          "id": "bbt12345",
          "type": "INDIVIDUAL",
          "attributes": {
              "first_name": "Sheldon",
              "last_name": "Cooper",
              "dob": "1983-05-12",
              "city": "Pasadena",
              "street_address": "2311 North Los Robles Avenue",
              "country": "US",
              "onboarding_date": "2019-04-16",
              "email": "sheldon.cooper@gmail.com",
              "phone_number": "+1582693582",
              "id_document": "passport",
              "id_country": "US",
              "gender": "F"
          }
      }
      headers = {
          "Content-Type": "application/json",
          "Authorization": "{yourBearerToken}"
      }

      response = requests.request("POST", url, json=payload, headers=headers)

      print(response.text)
      ```
      ### 2. Add a transaction
      Add a new transaction, according to the documentation at [addTransaction(POST)](#operation/addTransaction).

      #### With cURL
      ```
      curl --request POST \
        --url https://app.salv.com/api/v1/persons/bbt12345/transactions \
        --header 'Authorization: Bearer {yourBearerToken}' \
        --header 'Content-Type: application/json' \
        --data '{
        "id": "aeio-1234567",
        "attributes": {
          "sender_name": "Sheldon Cooper",
          "sender_account": "GB123456789",
          "receiver_name": "Leonard Hofstadter",
          "receiver_account": "DE987654321",
          "amount": "15678.34",
          "type": "wire_transfer",
          "direction": "I",
          "timestamp": "2022-01-20T08:48:39.000Z"
        }
      }'
      ```

      #### With Python Requests
      ```
      import requests

      url = "https://app.salv.com/api/v1/persons/bbt12345/transactions"

      payload = {
          "id": "aeio-1234567",
          "attributes": {
              "sender_name": "Sheldon Cooper",
              "sender_account": "GB123456789",
              "receiver_name": "Leonard Hofstadter",
              "receiver_account": "DE987654321",
              "amount": "15678.34",
              "type": "wire_transfer",
              "direction": "I",
              "timestamp": "2022-01-20T08:48:39.000Z"
          }
      }
      headers = {
          "Content-Type": "application/json",
          "Authorization": "{yourBearerToken}"
      }

      response = requests.request("POST", url, json=payload, headers=headers)

      print(response.text)
      ```
  - name: monitoring-checks
    description: |
      Person & Transaction monitoring.
      
      Real-time (ONLINE) scenarios should be used when an alert created by the scenario should block the transaction. [Example: Real-time (pre-processing) transaction monitoring](#tag/monitoring-overview/Example:-Real-time-(pre-processing)-transaction-monitoring)

      Post-event (OFFLINE) scenarios should be used when an alert created should NOT block the transaction. [Example: Simple integration](#tag/aml/Example:-Uploading-person-and-transaction)

      In the rare occasion that a monitoring check fails with error code 500, the transaction should be blocked. In that case Salv has not been able to verify that the transaction is safe to process.
    x-displayName: Monitoring checks
