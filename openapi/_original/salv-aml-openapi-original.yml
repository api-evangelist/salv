              description: Persons's external ID
              minLength: 1
            transactionId:
              type: string
              example: transaction-0000005
              description: Transaction's external ID
              minLength: 1
            updatedBy:
              type: string
              example: Name
              description: User updating alert
              minLength: 1
    ManualAlertCreatedEvent:
      required:
        - metadata
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - properties:
            metadata:
              $ref: '#/components/schemas/ManualAlertCreatedEventMeta'
    ManualAlertCreatedEventMeta:
      required:
        - alertId
        - personId
        - rationale
        - rationaleComment
        - userId
      allOf:
        - properties:
            alertId:
              type: integer
              format: int64
              example: 1001
              description: Updated alert's ID
              minimum: 1
            personId:
              type: string
              example: user-0000007
              description: Persons's external ID
              minLength: 1
            transactionId:
              type: string
              example: transaction-0000005
              description: Transaction's external ID
              minLength: 1
            rationale:
              example: SUSPICIOUS_ACTIVITY
              description: Alert rationale code
              minLength: 1
              type: string
            rationaleComment:
              example: Test
              description: Comment explaining the rationale choice
              minLength: 1
              type: string
            userId:
              type: integer
              format: int64
              example: 123
              description: ID of the user that has created the alert
              minimum: 1
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        In order to use the API, you need to generate client credentials using [Salv UI](https://demo.salv.com/credentials).
        Never share your secret keys. Keep them guarded and secure.

        We use OAuth2 client credentials flow to issue our API tokens.
        By default our API tokens have expiration time of 50 years, so effectively they never expire.
        Please do not make any assumptions about the content of the access_token.
        At the moment we use a JWT token, but it can change to any other string with the future updates.

        An API token can be invalidated using Salv UI by deleting the client credentials that were used to generate the token.

        Please make sure you only request it once per reasonable amount of time,
        as `oauth/token` endpoint has a rate limit of **10 requests per minute** per IP address.

        | Environment | Token URL |
        |-------------|-----------|
        | Production | `https://app.salv.com/oauth/token` |
        | Sandbox | `https://demo.salv.com/oauth/token` |

        Use the token URL matching your selected server environment.
      flows:
        clientCredentials:
          tokenUrl: https://app.salv.com/oauth/token
          x-tokenUrl-sandbox: https://demo.salv.com/oauth/token
          scopes:
            aml: Can use AML API
security:
  - OAuth2:
      - aml
