                    dob: '1983-05-12'
                    city: Pasadena
                    street_address: 2311 North Los Robles Avenue
                    country: US
                    onboarding_date: '2019-04-16T11:10:55.123456Z'
                    email: sheldon.cooper@gmail.com
                    phone_number: '+1582693582'
                    id_document: passport
                    id_country: US
                    gender: F
