    url: openapi/salv-manual-alerts-api-openapi.yml
- aid: salv:salv-monitoring-checks-api
  name: Salv monitoring-checks API
  description: >-
    Person & Transaction monitoring.


    Real-time (ONLINE) scenarios should be used when an alert created by the scenario should block the
    transaction. [Example: Real-time (pre-processing) transaction monitoring](#tag/monitoring-overview/Example:-Real-time-(pre-processing)-transaction-monitoring)


    Post-event (OFFLINE) scenarios should be used when an alert created should NOT block the transaction.
    [Example: Simple integration](#tag/aml/Example:-Uploading-person-and-transaction)


    In the rare occasion that a monitoring check fails with error code 500, the transaction should be
    blocked. In that case Salv has not been able to verify that the transaction is safe to process.
  humanURL: https://docs.salv.com/
  baseURL: https://app.salv.com/api
  tags:
  - monitoring-checks
  properties:
