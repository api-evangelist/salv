- aid: salv:salv-aml-api
  name: Salv aml API
  description: "This section contains all operations managing the state of persons and transactions.\n\
    \nThere are three endpoints for creating or modifying a person, make sure to choose the right one\
    \ for your task:\n* [Create new person](#tag/aml/operation/addPersonV2) will create a new person if\
    \ a person with the same ID does not already exist in our system. \n* [Patch person](#tag/aml/operation/patchPersonV2)\
    \ partially updates an existing person if this person exists in the system. A request to this endpoint\
    \ will only update or add \nattributes which are provided in the request. Use this endpoint to update\
    \ selected \nattributes of a person or to add new attributes without changing attributes not present\
    \ in the request payload. This endpoint may also be used to update person type.\n* [Update person](#tag/aml/operation/updatePersonV2)\
    \ updates an existing person if this person exists in the system. A request to this endpoint must\
    \ contain both person type and attributes. \nA request to this endpoint overwrites both person type\
    \ and attributes with the values given in the request.\n\nID of a person or a transaction is a case-sensitive\
    \ text field in our system. Salv does not transform the ID in any way. Only the following characters\
    \ are allowed: Alphanumerics `a-zA-Z0-9`, hyphens `-`, underscores `_`, colons `:`, dots `.`.\n\n\
    All requests must use ISO-8601 formatted timestamps. That includes defined fields (e.g. timestamp\
    \ property in \"Create new transaction\" request) and custom key-value pairs (e.g. under attributes\
    \ property in \"Create new person\" request).\n\nFor any data passed in person or transaction objects,\
    \ the keys must adhere to the following rules:  \n- It must not contain a \"**.**\"\n- It must not\
    \ consist of whitespaces\n\n## Example: Uploading person and transaction\nThis example shows how to\
    \ upload data to use it later for monitoring or screening.\n\n### 1. Add a person if not already added\n\
    Add a new person, according to the documentation at [addPerson(POST)](#operation/addPersonV2).\n\n\
    If the person has already been added to Salv, then skip this step.\n\n#### With cURL\n```\ncurl --request\
    \ POST \\\n  --url https://app.salv.com/api/v2/persons \\\n  --header 'Authorization: Bearer {yourBearerToken}'\
    \ \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n  \"id\": \"bbt12345\",\n  \"type\"\
    : \"INDIVIDUAL\",\n  \"attributes\": {\n    \"first_name\": \"Sheldon\",\n    \"last_name\": \"Cooper\"\
    ,\n    \"dob\": \"1983-05-12\",\n    \"city\": \"Pasadena\",\n    \"street_address\": \"2311 North\
    \ Los Robles Avenue\",\n    \"country\": \"US\",\n    \"onboarding_date\": \"2019-04-16\",\n    \"\
    email\": \"sheldon.cooper@gmail.com\",\n    \"phone_number\": \"+1582693582\",\n    \"id_document\"\
    : \"passport\",\n    \"id_country\": \"US\",\n    \"gender\": \"F\"\n  }\n}'\n```\n\n#### With Python\
    \ Requests\n```\nimport requests\n\nurl = \"https://app.salv.com/api/v2/persons\"\n\npayload = {\n\
    \    \"id\": \"bbt12345\",\n    \"type\": \"INDIVIDUAL\",\n    \"attributes\": {\n        \"first_name\"\
    : \"Sheldon\",\n        \"last_name\": \"Cooper\",\n        \"dob\": \"1983-05-12\",\n        \"city\"\
    : \"Pasadena\",\n        \"street_address\": \"2311 North Los Robles Avenue\",\n        \"country\"\
    : \"US\",\n        \"onboarding_date\": \"2019-04-16\",\n        \"email\": \"sheldon.cooper@gmail.com\"\
    ,\n        \"phone_number\": \"+1582693582\",\n        \"id_document\": \"passport\",\n        \"\
    id_country\": \"US\",\n        \"gender\": \"F\"\n    }\n}\nheaders = {\n    \"Content-Type\": \"\
    application/json\",\n    \"Authorization\": \"{yourBearerToken}\"\n}\n\nresponse = requests.request(\"\
    POST\", url, json=payload, headers=headers)\n\nprint(response.text)\n```\n### 2. Add a transaction\n\
    Add a new transaction, according to the documentation at [addTransaction(POST)](#operation/addTransaction).\n\
    \n#### With cURL\n```\ncurl --request POST \\\n  --url https://app.salv.com/api/v1/persons/bbt12345/transactions\
    \ \\\n  --header 'Authorization: Bearer {yourBearerToken}' \\\n  --header 'Content-Type: application/json'\
    \ \\\n  --data '{\n  \"id\": \"aeio-1234567\",\n  \"attributes\": {\n    \"sender_name\": \"Sheldon\
    \ Cooper\",\n    \"sender_account\": \"GB123456789\",\n    \"receiver_name\": \"Leonard Hofstadter\"\
    ,\n    \"receiver_account\": \"DE987654321\",\n    \"amount\": \"15678.34\",\n    \"type\": \"wire_transfer\"\
    ,\n    \"direction\": \"I\",\n    \"timestamp\": \"2022-01-20T08:48:39.000Z\"\n  }\n}'\n```\n\n####\
    \ With Python Requests\n```\nimport requests\n\nurl = \"https://app.salv.com/api/v1/persons/bbt12345/transactions\"\
    \n\npayload = {\n    \"id\": \"aeio-1234567\",\n    \"attributes\": {\n        \"sender_name\": \"\
    Sheldon Cooper\",\n        \"sender_account\": \"GB123456789\",\n        \"receiver_name\": \"Leonard\
    \ Hofstadter\",\n        \"receiver_account\": \"DE987654321\",\n        \"amount\": \"15678.34\"\
    ,\n        \"type\": \"wire_transfer\",\n        \"direction\": \"I\",\n        \"timestamp\": \"\
    2022-01-20T08:48:39.000Z\"\n    }\n}\nheaders = {\n    \"Content-Type\": \"application/json\",\n \
    \   \"Authorization\": \"{yourBearerToken}\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload,\
    \ headers=headers)\n\nprint(response.text)\n```"
  humanURL: https://docs.salv.com/
  baseURL: https://app.salv.com/api
  tags:
  - aml
