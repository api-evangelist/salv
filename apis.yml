  - type: OpenAPI
    url: openapi/salv-aml-api-openapi.yml
- aid: salv:salv-custom-list-record-api
  name: Salv custom-list-record API
  description: >-
    Endpoints to add, update, delete and get custom list records.


    Custom Lists can be used in two ways:

    - Custom Lists can be used to screen persons and transactions against them in the same way it works
    for Dow Jones

    lists. For example, if a client has some in-house black list, it can be added to screening as custom
    list.

    - Custom Lists can be referenced in monitoring scenarios. For example, a scenario may trigger when
    the transaction

    amount is higher than some threshold and the recipient country is in custom list of high risk countries.
  humanURL: https://docs.salv.com/
