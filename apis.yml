name: Salv
description: >-
  Salv is an Estonian financial-crime prevention (FinCrime) SaaS platform used by
  banks, fintechs, and payment service providers to detect money laundering and
  prevent fraud. Its products include Salv Screening (sanctions, PEP/RCA and
  adverse-media screening), Salv Monitoring (real-time and post-event transaction
  monitoring), Salv Risk Scoring, and Salv Bridge (collaborative intelligence
  sharing). The Salv AML API (OpenAPI 3.0.3, OAuth2 client-credentials, scope
  `aml`) exposes 36 operations across persons, transactions, monitoring,
  screening, risk, alerts, custom lists, and bulk data upload, with a webhook
  surface for alert and status events. Salv is ISO/IEC 27001:2022 certified and
  SOC 2 Type 2 compliant.
