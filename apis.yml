- aid: salv:salv-risk-api
  name: Salv risk API
  description: "Risks levels are assigned to persons according to configured risk rules. It is up to client\
    \ how\nto interpret each particular level.\n\nRisk rules are configured in Salv UI.\n\nPerson risk\
    \ is scored every time one of the following triggering events occurs:\n- the person is created\n-\
    \ the person is updated\n- a transaction is added to the person\n- a monitoring alert is created for\
    \ the person\n- the status of a monitoring alert of the person is updated\n- the status of a screening\
    \ alert of the person is changed to any true positive status\n- the status of a screening alert of\
    \ the person is changed from any of true positive statuses to non true positive status\n\nPerson risk\
    \ scoring happens in the background and the service does not guarantee any time frame for it.\n\n\
    Risk levels can be overridden by client operators for any particular person. They would need to choose\
    \ one \nof the preconfigured override reasons, which are also configured in Salv UI."
  humanURL: https://docs.salv.com/
  baseURL: https://app.salv.com/api
  tags:
  - risk
  properties:
  - type: OpenAPI
    url: openapi/salv-risk-api-openapi.yml
