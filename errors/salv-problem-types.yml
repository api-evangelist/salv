problems:
- status: 400
  title: Bad request
  meaning: The request was malformed or failed validation.
  remediation: Check required fields, types, and the request schema for the operation.
- status: 401
  title: Unauthorized
  meaning: Missing, invalid, or expired OAuth2 bearer token.
  remediation: Obtain a token via the client-credentials flow at /oauth/token with scope aml.
- status: 404
  title: Resource not found
  meaning: The referenced person, transaction, alert, or record does not exist.
  remediation: Verify the path id; ensure the entity was created/uploaded first.
- status: 422
  title: Unprocessable entity
  meaning: Semantic conflict such as a person already existing.
  remediation: Fetch/patch the existing entity instead of creating a duplicate.
- status: 500
  title: Internal server error
  meaning: Server-side failure, e.g. execution of monitoring checks failed.
  remediation: Retry with backoff; contact support@salv.com if it persists.
